name: naturally_yours
description: Naturally Yours Beauty Supply — cross-platform (iOS + Android) client.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2                 # simple JSON GETs (catalog)
  dio: ^5.7.0                  # HTTP with interceptors
  cookie_jar: ^4.0.8           # persists the server session cookie
  dio_cookie_manager: ^3.1.1   # wires the cookie jar into dio
  provider: ^6.1.2             # lightweight state (cart / auth)
  shared_preferences: ^2.3.2   # persist the cookie jar across launches
  webview_flutter: ^4.10.0     # Square Web Payments card entry

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
