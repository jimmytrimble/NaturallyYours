# Render Blueprint for the Naturally Yours server + database.
# In Render: New → Blueprint → point at this repo. Review and create.
# Fill the `sync: false` secrets in the Render dashboard (they are not stored in git).

databases:
  - name: naturallyyours-db
    plan: free            # free Postgres (note: free DBs are deleted after 90 days)
    databaseName: naturallyyours
    user: naturallyyours

services:
  - type: web
    name: naturallyyours-server
    runtime: docker
    plan: free            # free web services sleep after inactivity (cold starts)
    rootDir: NaturallyYoursServer
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/products
    autoDeploy: true
    envVars:
      # Database connection (injected automatically from the managed Postgres above).
      - key: DATABASE_URL
        fromDatabase:
          name: naturallyyours-db
          property: connectionString

      # --- Square (set these in the dashboard) ---
      - key: SQUARE_ACCESS_TOKEN
        sync: false
      - key: SQUARE_APPLICATION_ID
        sync: false
      - key: SQUARE_LOCATION_ID
        sync: false
      - key: SQUARE_ENVIRONMENT
        value: sandbox         # change to "production" when going live

      # --- Zoho support email (set secrets in the dashboard) ---
      - key: SUPPORT_EMAIL
        sync: false
      - key: ZOHO_APP_PASSWORD
        sync: false
      - key: ZOHO_SMTP_HOST
        value: smtp.zoho.com
      - key: ZOHO_SMTP_PORT
        value: "465"
      - key: SUPPORT_FROM_NAME
        value: Naturally Yours Support

      # --- Shipping (flat rate, in cents; 0 = free) ---
      - key: SHIPPING_FLAT_CENTS
        value: "0"
